    "crates/lingxiao-core",
    "crates/lingxiao-core-protocol",
    "crates/lingxiao-core-daemon",
    "crates/lingxiao-tool-host-protocol",
    "crates/lingxiao-llm-host-protocol",
    "crates/lingxiao-llm-openai-provider",
    "crates/lingxiao-llm-anthropic-provider",
