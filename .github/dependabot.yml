version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      frontend-runtime:
        patterns:
          - "react"
          - "react-*"
          - "@types/react"
          - "@types/react-dom"
          - "zustand"
          - "i18next"
          - "react-i18next"
          - "lucide-react"
          - "mermaid"
          - "pixi.js"
          - "@xyflow/react"
          - "@monaco-editor/react"
          - "@xterm/*"
      frontend-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tsx"
          - "@types/*"
      backend-ai-and-mcp:
        patterns:
          - "openai"
          - "@ai-sdk/*"
          - "@anthropic-ai/*"
          - "@modelcontextprotocol/*"
          - "@langfuse/*"
          - "@opentelemetry/*"
          - "ai"
      backend-runtime:
        patterns:
          - "fastify"
          - "@fastify/*"
          - "playwright"
          - "simple-git"
          - "node-fetch"
          - "undici"
          - "glob"
          - "chalk"
          - "commander"
          - "chokidar"
          - "inquirer"
          - "proxy-agent"
          - "yaml"
          - "zod"
      office-and-assets:
        patterns:
          - "docx"
          - "exceljs"
          - "jszip"
          - "mammoth"
          - "pdf-lib"
          - "pdf-parse"
          - "pdfkit"
          - "pptxgenjs"
          - "sharp"
          - "skia-canvas"
          - "tesseract.js"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
